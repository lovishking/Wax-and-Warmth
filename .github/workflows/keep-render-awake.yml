name: Keep Render API warm

on:
  schedule:
    # Ping every 10 minutes to stay within Render's 15-minute inactivity window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request lightweight API endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 https://wax-and-warmth.onrender.com/api/settings/ > /dev/null || \
          curl --fail --silent --show-error --max-time 30 https://wax-and-warmth.onrender.com/api/health/ > /dev/null
