name: Keep Render API warm

on:
  schedule:
    # Ping every 5 minutes so GitHub Actions queue delays never exceed Render's 15-minute sleep window
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health and products endpoints
        run: |
          curl -s --max-time 30 https://wax-and-warmth.onrender.com/api/health/ > /dev/null || true
          curl -s --max-time 30 https://wax-and-warmth.onrender.com/api/products/featured/ > /dev/null || true
